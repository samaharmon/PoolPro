<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=../index.html">
  <title>PoolPro</title>
  <meta name="apple-mobile-web-app-title" content="PoolPro">
  <meta name="theme-color" content="#202834">
  <link rel="apple-touch-icon" sizes="180x180" href="/Images/Logos/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" type="image/png" sizes="96x96" href="/Images/Logos/favicon-96x96.png">
  <link rel="shortcut icon" href="/Images/Logos/favicon.ico">
</head>
<body>
  <p>Redirecting… <a href="../index.html">Click here if not redirected.</a></p>
<body class="home-body">
  <header class="home-header">
    <img src="../Images/Logos/logo.png" alt="PoolPro logo" class="home-logo" />
    <h1 class="home-title">PoolPro</h1>
  </header>

  <main class="home-main">
    <hr class="home-divider">

    <nav class="home-menu">
      <button class="home-menu-item" data-access-role="attendant">
        <span>Gate Attendants</span>
      </button>
      <button class="home-menu-item" data-access-role="lifeguard">
        <span>Lifeguards</span>
      </button>
      <button class="home-menu-item" data-access-role="manager">
        <span>Managers</span>
      </button>
      <button class="home-menu-item" data-access-role="supervisor">
        <span>Supervisors</span>
      </button>
    </nav>
  </main>

  <!-- Login modal -->
  <div id="homeLoginModal" class="modal">
    <div class="modal-content home-login-modal">
      <button class="close" id="homeLoginClose">&times;</button>
      <h2 id="homeModalTitle">Sign in</h2>

      <form id="homeLoginForm">
        <div class="form-group">
          <label id="homeUsernameLabel" for="homeUsernameInput">Username or Email</label>
          <input type="text" id="homeUsernameInput" autocomplete="username">
        </div>
        <div class="form-group" id="homePasswordGroup">
          <label id="homePasswordLabel" for="homePasswordInput">Password</label>
          <input type="password" id="homePasswordInput" autocomplete="current-password">
        </div>

        <button type="button" class="home-create-link-btn" id="homeShowCreateAccountBtn">Create Account</button>

        <p class="form-message" id="homeLoginMessage"></p>

        <div class="home-form-actions">
          <button type="submit" class="submit-btn" id="homeLoginSubmit">Continue</button>
        </div>
      </form>

      <form id="homeCreateAccountForm" class="hidden">
        <div class="home-form-grid">
          <div class="form-group">
            <label for="homeCreateUsernameInput">Username</label>
            <input type="text" id="homeCreateUsernameInput" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="homeCreateFirstNameInput">Preferred First Name</label>
            <input type="text" id="homeCreateFirstNameInput" autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="homeCreateLastNameInput">Last Name</label>
            <input type="text" id="homeCreateLastNameInput" autocomplete="family-name">
          </div>
          <div class="form-group">
            <label for="homeCreateEmailInput">Email</label>
            <input type="email" id="homeCreateEmailInput" autocomplete="email">
          </div>
          <div class="form-group">
            <label for="homeCreatePhoneInput">Phone Number</label>
            <input type="tel" id="homeCreatePhoneInput" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="homeCreatePoolInput">Home Facility</label>
            <select id="homeCreatePoolInput">
              <option value="">Select facility</option>
            </select>
          </div>
          <div class="form-group">
            <label for="homeCreatePasswordInput">Password</label>
            <input type="password" id="homeCreatePasswordInput" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="homeCreateConfirmPasswordInput">Confirm Password</label>
            <input type="password" id="homeCreateConfirmPasswordInput" autocomplete="new-password">
          </div>
        </div>

        <p class="form-message" id="homeCreateAccountMessage"></p>

        <div class="home-form-actions">
          <button type="submit" class="submit-btn" id="homeCreateAccountSubmit">Save Info</button>
          <button type="button" class="submit-btn secondary-btn" id="homeBackToLoginBtn">Back to Sign In</button>
        </div>
      </form>

      <form id="homeVerifyForm" class="hidden">
        <p class="home-verify-copy" id="homeVerifySubtitle"></p>
        <p class="home-verify-hint" id="homeVerifyHint">Check spam if it does not arrive within 60 seconds. Use resend if needed.</p>

        <div class="home-verify-status">
          <p class="home-verify-timer" id="homeVerifyCooldownText"></p>
          <p class="form-message" id="homeVerifyMessage"></p>
        </div>

        <div class="home-verify-actions">
          <button type="button" class="submit-btn secondary-btn" id="homeVerifyResendBtn">Resend Verification</button>
          <button type="button" class="submit-btn secondary-btn" id="homeVerifyBackBtn">Return to Login</button>
        </div>
      </form>
    </div>
  </div>


  <script type="module" src="firebase.js"></script>
  <script type="module" src="home.js"></script>
</body>
</html>
